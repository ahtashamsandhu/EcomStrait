# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

# The app's client id is NOT committed. Copy it from the Partner dashboard
# (App setup -> Client ID) into this line and into SHOPIFY_API_KEY in .env, or
# run `shopify app config link` which fills it in from the dashboard for you.
client_id = "<your-client-id>"
name = "EcomStraitAI"
application_url = "https://shopify-ten-jet.vercel.app"
embedded = true

[build]
# `shopify app dev` rewrites application_url and redirect_urls in the Partner
# dashboard to a temporary tunnel. Left on, a dev session silently repoints the
# published app at a URL that dies when the session ends — which breaks the
# install link for everyone until the next deploy. Turn it back on only if you
# are developing against a separate dev app.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Orders sync → EcomStrait platform. Requires Protected Customer Data access.
  [[webhooks.subscriptions]]
  uri = "https://os-merchant.vercel.app/api/shopify/webhooks"
  topics = [ "orders/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders → orders/create webhook (Protected Customer Data).
# read_themes/write_themes → Liquid theme upload.
# read_locations/write_inventory → sync supplier stock levels onto variants.
# read_publications/write_publications → publish products to the Online Store
# sales channel. Without this a product exists in admin but never appears on
# the storefront (publishedAt stays null).
# read_shipping/write_shipping → create a default delivery rate at provision,
# and read it back for the launch checklist.
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_orders,read_themes,write_themes,read_locations,write_inventory,read_publications,write_publications,read_shipping,write_shipping"

[auth]
# /auth/callback, not /api/auth. `/api/auth` is the old Remix template's path
# and returns 404 on this one — shopify.server.ts sets authPathPrefix = "/auth"
# and the only auth route is app/routes/auth.$.tsx, so OAuth had nowhere to
# come back to. Must match the redirect URLs in the Partner dashboard, which
# only update when `shopify app deploy` is run.
redirect_urls = [ "https://shopify-ten-jet.vercel.app/auth/callback" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
